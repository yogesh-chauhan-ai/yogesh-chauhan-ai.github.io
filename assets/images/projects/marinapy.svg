<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ecfeff"/>
      <stop offset="100%" style="stop-color:#eff6ff"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a56db"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <filter id="s">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0891b2" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>
  <rect x="0" y="0" width="480" height="4" fill="url(#teal)"/>

  <!-- Marina map panel -->
  <rect x="16" y="50" width="290" height="200" rx="10" fill="white" stroke="#bae6fd" stroke-width="1" filter="url(#s)"/>
  <!-- Water -->
  <rect x="16" y="50" width="290" height="200" rx="10" fill="#e0f2fe"/>
  <path d="M16,90 Q60,84 106,90 T196,90 T296,90" fill="none" stroke="#bae6fd" stroke-width="2"/>
  <path d="M16,130 Q60,124 106,130 T196,130 T296,130" fill="none" stroke="#bae6fd" stroke-width="2"/>
  <path d="M16,170 Q60,164 106,170 T196,170 T296,170" fill="none" stroke="#bae6fd" stroke-width="2"/>
  <path d="M16,210 Q60,204 106,210 T196,210 T296,210" fill="none" stroke="#bae6fd" stroke-width="2"/>

  <!-- Docks / piers -->
  <rect x="30" y="60" width="10" height="180" fill="#94a3b8"/>
  <rect x="120" y="60" width="10" height="180" fill="#94a3b8"/>
  <rect x="210" y="60" width="10" height="180" fill="#94a3b8"/>

  <!-- Berths (slips) with occupancy -->
  <g>
    <rect x="44" y="70" width="24" height="14" rx="2" fill="#059669"/>
    <rect x="44" y="92" width="24" height="14" rx="2" fill="#059669"/>
    <rect x="44" y="114" width="24" height="14" rx="2" fill="#d97706"/>
    <rect x="44" y="136" width="24" height="14" rx="2" fill="#059669"/>
    <rect x="44" y="158" width="24" height="14" rx="2" fill="#cbd5e1"/>
    <rect x="44" y="180" width="24" height="14" rx="2" fill="#059669"/>
    <rect x="44" y="202" width="24" height="14" rx="2" fill="#d97706"/>

    <rect x="134" y="70" width="24" height="14" rx="2" fill="#059669"/>
    <rect x="134" y="92" width="24" height="14" rx="2" fill="#cbd5e1"/>
    <rect x="134" y="114" width="24" height="14" rx="2" fill="#059669"/>
    <rect x="134" y="136" width="24" height="14" rx="2" fill="#059669"/>
    <rect x="134" y="158" width="24" height="14" rx="2" fill="#d97706"/>
    <rect x="134" y="180" width="24" height="14" rx="2" fill="#059669"/>
    <rect x="134" y="202" width="24" height="14" rx="2" fill="#059669"/>

    <rect x="224" y="70" width="24" height="14" rx="2" fill="#cbd5e1"/>
    <rect x="224" y="92" width="24" height="14" rx="2" fill="#059669"/>
    <rect x="224" y="114" width="24" height="14" rx="2" fill="#059669"/>
    <rect x="224" y="136" width="24" height="14" rx="2" fill="#d97706"/>
    <rect x="224" y="158" width="24" height="14" rx="2" fill="#059669"/>
    <rect x="224" y="180" width="24" height="14" rx="2" fill="#059669"/>
    <rect x="224" y="202" width="24" height="14" rx="2" fill="#cbd5e1"/>
  </g>

  <text x="161" y="232" text-anchor="middle" font-size="8" fill="#0369a1" font-family="sans-serif" font-weight="bold">Real-time Berth Occupancy</text>
  <text x="161" y="267" text-anchor="middle" font-size="8" fill="#94a3b8" font-family="sans-serif">Interactive Marina Map · PostGIS</text>

  <!-- Right panel -->
  <g filter="url(#s)">
    <rect x="316" y="50" width="148" height="200" rx="10" fill="white" stroke="#bae6fd" stroke-width="1"/>
    <rect x="316" y="50" width="148" height="28" rx="10" fill="url(#teal)"/>
    <rect x="316" y="66" width="148" height="12" rx="0" fill="url(#teal)"/>
    <text x="390" y="68" text-anchor="middle" font-size="9" fill="white" font-family="sans-serif" font-weight="bold">MarinaPy Dashboard</text>

    <!-- Stats -->
    <text x="326" y="96" font-size="8" fill="#94a3b8" font-family="sans-serif" font-weight="bold">SLIPS BOOKED</text>
    <text x="326" y="111" font-size="20" fill="#0891b2" font-family="Georgia,serif" font-weight="bold">86%</text>
    <text x="400" y="108" font-size="10" fill="#059669" font-family="sans-serif">↑ 5%</text>

    <line x1="326" y1="118" x2="452" y2="118" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Revenue -->
    <text x="326" y="132" font-size="8" fill="#94a3b8" font-family="sans-serif">Invoiced (MTD)</text>
    <text x="326" y="145" font-size="13" fill="#1a56db" font-family="Georgia,serif" font-weight="bold">$48,900</text>

    <!-- Status list -->
    <rect x="326" y="154" width="126" height="16" rx="4" fill="#ecfdf5"/>
    <circle cx="336" cy="162" r="4" fill="#059669"/>
    <text x="346" y="165" font-size="8" fill="#334155" font-family="sans-serif">Occupied: 214</text>

    <rect x="326" y="174" width="126" height="16" rx="4" fill="#fffbeb"/>
    <circle cx="336" cy="182" r="4" fill="#d97706"/>
    <text x="346" y="185" font-size="8" fill="#334155" font-family="sans-serif">Reserved: 37</text>

    <rect x="326" y="194" width="126" height="16" rx="4" fill="#eff6ff"/>
    <circle cx="336" cy="202" r="4" fill="#1a56db"/>
    <text x="346" y="205" font-size="8" fill="#334155" font-family="sans-serif">Available: 41</text>

    <!-- Mini sparkline -->
    <polyline points="326,228 346,224 366,220 386,222 406,214 426,208 446,204" fill="none" stroke="url(#teal)" stroke-width="2" stroke-linecap="round"/>
    <text x="326" y="242" font-size="7.5" fill="#94a3b8" font-family="sans-serif">Django · PostGIS · Boater App</text>
  </g>
</svg>
